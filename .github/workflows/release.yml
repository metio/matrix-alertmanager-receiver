name: Release
on:
  schedule:
    - cron: 35 5 * * WED
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_count: ${{ steps.commits.outputs.count }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: last_release
        name: Fetch Last Release
        run: echo "tag=$(gh release view --json tagName --jq '.tagName')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: commits
        name: Count Commits
        run: echo "count=$(git rev-list --count "${LAST_RELEASE}..HEAD")" >> "$GITHUB_OUTPUT"
        env:
          LAST_RELEASE: ${{ steps.last_release.outputs.tag }}
      - id: release
        name: Create Release Version
        if: steps.commits.outputs.count > 0
        run: echo "version=$(date +'%Y.%-m.%-d')" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.commit_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@00adafd0fe1924f57325d9dd264d5d731fb099ad # 2026.11.4082509
        with:
          registries: github:metio/toolchains
      - name: Set the release version
        run: sed -i -e "s/var matrixAlertmanagerReceiverVersion = .*/var matrixAlertmanagerReceiverVersion = \"${VERSION}\"/" main.go
      - name: Build and archive
        run: |
          binary="matrix-alertmanager-receiver_v${VERSION}"
          go build -o "$binary" -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}"
          tar --create --gzip --file "matrix-alertmanager-receiver_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "$binary" LICENSE README.md
        env:
          CGO_ENABLED: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: matrix-alertmanager-receiver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-alertmanager-receiver_${{ needs.prepare.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
  github:
    name: GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.commit_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # cosign keyless sign-blob
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: matrix-alertmanager-receiver-*
          merge-multiple: true
      - name: Calculate Checksums
        run: sha256sum ./*.tar.gz > "matrix-alertmanager-receiver_${VERSION}_SHA256SUMS"
        working-directory: dist
      - uses: metio/ci/cosign-sign-blob@00adafd0fe1924f57325d9dd264d5d731fb099ad # 2026.11.4082509
        with:
          file: dist/matrix-alertmanager-receiver_${{ needs.prepare.outputs.release_version }}_SHA256SUMS
      - name: Create Release
        run: |
          cat > notes.md <<EOF
          Pull the container from \`docker.io/metio/matrix-alertmanager-receiver:${VERSION}\`. Check the [migration guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/MIGRATIONS.md) for any required actions on your part.
          EOF
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
  dockerhub:
    name: Dockerhub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - id: checkout
        name: Clone Git Repository
        if: needs.prepare.outputs.commit_count > 0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: versioning
        name: Modify release version
        if: needs.prepare.outputs.commit_count > 0
        run: sed -i -e "s/var matrixAlertmanagerReceiverVersion = .*/var matrixAlertmanagerReceiverVersion = \"${VERSION}\"/" main.go
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
      - id: cosign-install
        if: needs.prepare.outputs.commit_count > 0
        name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: buildx
        if: needs.prepare.outputs.commit_count > 0
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: dockerhub_login
        if: needs.prepare.outputs.commit_count > 0
        name: Login to Dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: timestamp
        if: needs.prepare.outputs.commit_count > 0
        name: Create Timestamp
        run: echo "date=$(date --rfc-3339=seconds)" >> "$GITHUB_OUTPUT"
      - id: publish
        if: needs.prepare.outputs.commit_count > 0
        name: Publish Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/metio/matrix-alertmanager-receiver:latest
            docker.io/metio/matrix-alertmanager-receiver:${{ needs.prepare.outputs.release_version }}
          labels: |
            org.opencontainers.image.title=matrix-alertmanager-receiver
            org.opencontainers.image.licenses=GPLv3
            org.opencontainers.image.vendor=metio
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.date }}
          cache-from: type=registry,ref=metio/matrix-alertmanager-receiver:buildcache
          cache-to: type=registry,ref=metio/matrix-alertmanager-receiver:buildcache,mode=max
          sbom: true
          provenance: true
      - id: sign
        if: needs.prepare.outputs.commit_count > 0
        name: Sign Image
        run: |
          cosign sign \
            --yes \
            --annotations "repo=${GITHUB_REPOSITORY}" \
            --annotations "workflow=${GITHUB_WORKFLOW}" \
            --annotations "ref=${GITHUB_SHA}" \
            "docker.io/metio/matrix-alertmanager-receiver@${DIGEST}"
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
      - id: documentation
        name: Docker Hub Description
        if: needs.prepare.outputs.commit_count > 0
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: metio/matrix-alertmanager-receiver
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.dockerhub.md
