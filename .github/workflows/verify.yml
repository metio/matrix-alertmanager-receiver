name: Verify Commits
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
      - id: toolchain
        name: Set up Toolchain
        uses: metio/breto@9fa67afc6a21b59600180acd0cee7d5eb26125ef # 2026.10.31164824
        with:
          registries: github:metio/toolchains
      - id: lint
        name: Lint Go Code
        run: |
          go vet ./...
          staticcheck ./...
          gosec -quiet ./...
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - id: vulnerabilities
        name: Check Vulnerabilities
        run: govulncheck ./...
      - id: tests
        name: Run Tests
        run: go test -v -cover ./...
      - id: buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: container_image
        name: Build Image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            docker.io/metio/matrix-alertmanager-receiver:${{ github.sha }}
