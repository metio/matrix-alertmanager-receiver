name: Baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: metio/ci/.github/workflows/baseline.yml@f6c5da232253f67486721f46cf4cd5d488189e04 # 2026.10.31224636
  baseline:
    name: Baseline
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::the baseline checks ended in $RESULT"; exit 1; }'
